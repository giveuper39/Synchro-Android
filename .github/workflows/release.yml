name: Android release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable tag to publish
        required: true
        type: string
env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Verify tag and prepare SDK
        run: |
          python3 tools/check_release.py "$RELEASE_TAG"
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SYNCRO_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/syncro-release.jks"
      - name: Build and test signed APK
        working-directory: android
        env:
          SYNCRO_KEYSTORE: ${{ runner.temp }}/syncro-release.jks
          SYNCRO_STORE_PASSWORD: ${{ secrets.SYNCRO_STORE_PASSWORD }}
          SYNCRO_KEY_ALIAS: syncro
          SYNCRO_KEY_PASSWORD: ${{ secrets.SYNCRO_KEY_PASSWORD }}
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintRelease :app:assembleRelease
      - name: Publish stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-universal-release.apk Syncro-Android.apk
          gh release create "$RELEASE_TAG" Syncro-Android.apk --verify-tag --title 'Синхро ${{ env.RELEASE_TAG }} · Android' --generate-notes
